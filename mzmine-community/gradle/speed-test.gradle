/*
 * Batch speed benchmark, see import_data.speed.BatchSpeedTestMain. Run this instead of starting the
 * main from the IDE when comparing branches: the heap is fixed here, so every branch is measured with
 * the same memory. The mzmine preferences (threads, GC after batch step) are not changed, they are
 * only documented in the results.
 *
 * gradlew batchSpeedTest -Pspeed.description=my-branch -Pspeed.batch=D:\some.mzbatch -Pspeed.out=D:\speed
 * gradlew batchSpeedReport -Pspeed.in=D:\speed.jsonlines
 *
 * The heap defaults to 32 GB and can be changed with -Pspeed.heapGb=16. Use the same value for all
 * branches that are compared.
 *
 * The properties are prefixed because plain names like 'description' collide with built in gradle
 * project properties.
 */
def speedTestProperties = ['out', 'description', 'batch', 'iterations', 'warmups', 'inMemory',
                           'headless', 'importOnce', 'trackMemory']

def SPEED_TEST_DEFAULT_HEAP_GB = 32

tasks.register('batchSpeedTest', JavaExec) {
    group = 'benchmark'
    description = 'Runs the batch speed test with a fixed heap, default 32 GB (-Pspeed.heapGb). See BatchSpeedTestMain.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('import_data.speed.BatchSpeedTestMain')
    def heapGb = project.hasProperty('speed.heapGb') ? project.property('speed.heapGb').toString().trim()
            : SPEED_TEST_DEFAULT_HEAP_GB.toString()
    if (!heapGb.isInteger() || heapGb.toInteger() < 1) {
        throw new GradleException("speed.heapGb must be a positive integer number of GB but was '$heapGb'")
    }
    // fixed min = max heap so that the GC behaves the same on every branch
    jvmArgs += application.applicationDefaultJvmArgs + ["-Xms${heapGb}g", "-Xmx${heapGb}g"]
    speedTestProperties.each { name ->
        if (project.hasProperty("speed.$name")) {
            systemProperty("mzmine.speed.$name", project.property("speed.$name"))
        }
    }
}

tasks.register('batchSpeedReport', JavaExec) {
    group = 'benchmark'
    description = 'Creates the html speed report from a speed test export. See SpeedReportMain.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('import_data.speed.SpeedReportMain')
    if (project.hasProperty('speed.in')) {
        args += [project.property('speed.in').toString()]
        if (project.hasProperty('speed.report')) {
            args += [project.property('speed.report').toString()]
        }
    }
}

/*
 * Isotope finder accuracy benchmarks. They live next to the speed benchmarks so the main build
 * script stays free of benchmark plumbing.
 *
 * gradlew benchmark                runs the @Tag("benchmark") tests, they are excluded from 'test'
 * gradlew isotopeBenchmark         rewrites the committed accuracy baseline with the current engine
 * gradlew generateBenchmarkCorpus  regenerates the committed corpus, rarely needed
 */

// Dedicated tier for slow/heavy isotope-finder benchmark tests (@Tag("benchmark")).
// Inherits --enable-preview and the logging config from the tasks.withType(Test) block in build.gradle.
tasks.register('benchmark', Test) {
    group = "verification"
    description = "Runs the benchmark-tagged tests (excluded from the default 'test' task)."
    // a manually-registered Test task is not auto-wired like the built-in 'test' task
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    maxHeapSize = '8g'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Keeps the benchmark tests out of the default CI test run. build.gradle calls useJUnitPlatform()
// on the same task later, gradle keeps the options configured here because the framework does not change.
tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

// Regenerates the isotope finder benchmark pattern corpus (JSONL) from the synthetic pattern generator.
// The --enable-preview jvmArg is added by the tasks.withType(JavaExec) block in build.gradle.
// decision: the corpus (~15 MB) is COMMITTED, not generated at build time. The CDK isotopologue
// enumeration for the catalog's proteins is expensive, and committing the snapshot pins the exact
// inputs the accuracy baselines were measured on, so a baseline diff always reflects an engine change
// rather than a corpus change. Run this ONLY when the catalog/sweep/degradations change - and then
// regenerate the baselines (isotopeBenchmark) and commit corpus + baselines together.
tasks.register("generateBenchmarkCorpus", JavaExec) {
    group = "benchmark"
    description = "Regenerates the COMMITTED isotope finder benchmark corpus (src/test/resources/isotopefinder/corpus/patterns.jsonl.gz). Slow; only needed when the catalog or sweep changes."
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "io.github.mzmine.modules.dataprocessing.filter_isotopefinder.benchmark.BenchmarkPatternGenerator"
    args = [layout.projectDirectory.file("src/test/resources/isotopefinder/corpus/patterns.jsonl.gz").asFile.absolutePath]
}

// Regenerates the committed isotope finder accuracy baseline by running the CURRENT engine over the
// whole corpus. The --enable-preview jvmArg is added by the tasks.withType(JavaExec) block in build.gradle.
tasks.register("isotopeBenchmark", JavaExec) {
    group = "benchmark"
    description = "Runs the isotope finder over the benchmark corpus and writes the accuracy baseline (src/test/resources/isotopefinder/baseline/metrics_baseline.csv)."
    dependsOn(processTestResources)
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "io.github.mzmine.modules.dataprocessing.filter_isotopefinder.benchmark.IsotopeBenchmarkMain"
    args = [layout.projectDirectory.file("src/test/resources/isotopefinder/baseline/metrics_baseline.csv").asFile.absolutePath]
}
